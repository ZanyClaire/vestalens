name: Build & Publish VistaLens APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Signed VistaLens APK
        run: |
          if [ -f release/VistaLens.apk ]; then
            echo "Using AI Studio pre-built and Firebase-signed APK"
            cp release/VistaLens.apk VistaLens.apk
          else
            echo "release/VistaLens.apk not found"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VistaLens-APK
          path: VistaLens.apk

      - name: Publish APK to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VistaLens v1.0.${{ github.run_number }} (Installable Android APK)"
          body: |
            ### VistaLens — AI Photo Tourism & AR Audio Guide
            Tap **`VistaLens.apk`** under **Assets** below on your Android phone to download and install the app.

            - **Direct APK Download**: [Download VistaLens.apk](https://github.com/${{ github.repository }}/releases/latest/download/VistaLens.apk)
            - **Image Recognition**: `gemini-4-argon`
            - **Historical Grounding**: `gemini-3.8-flash` (with Google Search)
            - **AR Audio Narration**: `gemini-3.8-flash-tts`
            - **Multilingual Persistence**: Jetpack DataStore Preferences
          files: VistaLens.apk
          draft: false
          prerelease: false
          make_latest: true
