name: Build & Publish VistaLens APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "Using existing debug.keystore"
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure .env file exists for Secrets Plugin
        run: |
          [ -f .env ] || cp .env.example .env

      - name: Build Installable APK
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk VistaLens.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VistaLens-APK
          path: VistaLens.apk

      - name: Publish APK to GitHub Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "VistaLens v1.0.${{ github.run_number }} (Installable Android APK)"
          body: |
            ### VistaLens — AI Photo Tourism & AR Audio Guide
            Tap **`VistaLens.apk`** under **Assets** below on your Android phone to download and install the app.
            
            - **Image Recognition**: `gemini-4-argon`
            - **Historical Grounding**: `gemini-3.8-flash` (with Google Search)
            - **AR Audio Narration**: `gemini-3.8-flash-tts`
            - **Multilingual Persistence**: Jetpack DataStore Preferences
          files: VistaLens.apk
          draft: false
          prerelease: false
          make_latest: true
